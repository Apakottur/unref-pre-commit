name: Mirror

# Opens a pull request that points the hook at the latest release of unref on PyPI, once it differs. A run that GitHub
# delays or skips is caught up by the next one. The Release workflow tags the version once the pull request is merged.
on:
  schedule:
    - cron: "17 * * * *"

  workflow_dispatch:

permissions: {}

concurrency:
  group: mirror

jobs:
  mirror:
    name: Mirror
    if: github.repository == 'Apakottur/unref-pre-commit'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Set the latest version
        id: mirror
        run: uv run --no-project mirror.py

      - name: Open or update the pull request
        if: steps.mirror.outputs.version
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: mirror
          commit-message: Mirror unref ${{ steps.mirror.outputs.version }}
          title: Mirror unref ${{ steps.mirror.outputs.version }}
          body: |
            Points the hook at [unref ${{ steps.mirror.outputs.version }}](https://github.com/Apakottur/unref/releases/tag/v${{ steps.mirror.outputs.version }}). Once merged, the Release workflow tags it as `v${{ steps.mirror.outputs.version }}`.
