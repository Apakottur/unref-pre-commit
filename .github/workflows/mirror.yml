name: Mirror

# Mirrors each new release of unref on PyPI as a commit, a tag and a GitHub release. A run that GitHub delays or skips
# is caught up by the next one, as every release newer than the mirrored one is mirrored.
on:
  schedule:
    - cron: "17 * * * *"

  workflow_dispatch:

permissions: {}

concurrency:
  group: mirror

jobs:
  mirror:
    name: Mirror
    if: github.repository == 'Apakottur/unref-pre-commit'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Required to push the commits and the tags.
          persist-credentials: true # zizmor: ignore[artipacked]

      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Set the git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Mirror the new releases
        run: uv run --no-project mirror.py

      - name: Push and release the new versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The tags of the new commits, which main does not have yet.
          tags=$(git tag --no-merged origin/main --sort=v:refname)
          if [ -z "$tags" ]; then
            echo "No new release of unref."
            exit 0
          fi
          # shellcheck disable=SC2086
          git push --atomic origin HEAD:main $tags
          for tag in $tags; do
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" --latest \
              --notes "See https://github.com/Apakottur/unref/releases/tag/$tag"
          done
