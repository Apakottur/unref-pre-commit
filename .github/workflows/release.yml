name: Release

# Tags and releases the version of unref that the hook names, once a pull request that changes it is merged.
on:
  push:
    branches: [main]
    paths: [pyproject.toml]

  workflow_dispatch:

permissions: {}

jobs:
  release:
    name: Release
    if: github.repository == 'Apakottur/unref-pre-commit'
    runs-on: ubuntu-latest
    permissions:
      # Required to create the tag and the GitHub Release.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create the tag and the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c 'import re, tomllib; print(next(re.fullmatch(r"unref==(.+)", d)[1] for d in tomllib.load(open("pyproject.toml", "rb"))["project"]["dependencies"] if d.startswith("unref==")))')
          tag="v$version"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag is already released."
            exit 0
          fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$tag" --latest \
            --notes "See https://github.com/Apakottur/unref/releases/tag/$tag"
